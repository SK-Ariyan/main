<!DOCTYPE html>
<html>
<head>
<title>Schedule</title>
<link rel="stylesheet" href="schedule.css">
</head>

<body>

<h2>Weekly Schedule</h2>
<div id="schedule"></div>

<script src="core.js"></script>
<script>

let schedule = JSON.parse(localStorage.getItem("schedule")) || {};

let div = document.getElementById("schedule");
div.innerHTML = "";

if(Object.keys(schedule).length === 0){
    div.innerHTML = "<p>No schedule found. Go create one first.</p>";
}else{
    for(let day in schedule){

        let readableDate = new Date(day).toDateString();
        let html = `<h3>${readableDate}</h3>`;

        if(schedule[day] && schedule[day].length > 0){
            schedule[day].forEach(t=>{
                html += `<p>${t.subject} - ${t.duration} hr</p>`;
            });
        } else {
            html += `<p>No study planned</p>`;
        }

        div.innerHTML += html;
    }
}

</script>


</body>
</html>
