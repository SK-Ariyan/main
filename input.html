<!DOCTYPE html>
<html>
<head>
    <title>Create Schedule</title>
    <link rel="stylesheet" href="input.css">
</head>
<body>
<div class="container">

    <h2>Create Your Schedule</h2>
    
    <!-- Subjects -->
    <div class="row">
        <input id="subjects" placeholder="Subjects (comma)">
        <input id="weak" placeholder="Weak subject">
</div>

<!-- Current Day Input -->
<h3 id="dayTitle">Monday</h3>
<input id="hours" placeholder="Enter hours">

<!-- Buttons -->
<div class="btns">
    <button onclick="nextDay()">Next Day</button>
    <button onclick="generate()">Generate Schedule</button>
</div>
</div>

<script src="core.js"></script>
<script>
let days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
let index = 0;
let weeklyTime = {};

// ------------------- NEXT DAY -------------------
function nextDay(){
    let h = +document.getElementById("hours").value;

    if(!h){
        alert("Enter hours first");
        return;
    }

    weeklyTime[days[index]] = h;
    index++;

    if(index < days.length){
        document.getElementById("dayTitle").innerText = days[index];
        document.getElementById("hours").value = "";
    } else {
        alert("✅ All days entered! Now click Generate.");
        document.getElementById("dayTitle").innerText = "All days entered";
    }
}

// ------------------- GENERATE -------------------
function generate(){
    if(Object.keys(weeklyTime).length < 7){
        alert("Please enter hours for all 7 days first!");
        return;
    }

    let subjectsInput = document.getElementById("subjects").value;
    if(!subjectsInput){
        alert("Enter at least one subject!");
        return;
    }

    let subjects = parseSubjects(subjectsInput);

}
</script>

</body>
</html>
