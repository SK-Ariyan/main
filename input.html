<!DOCTYPE html>
<html>
<head>
    <title>Create Schedule</title>
    <link rel="stylesheet" href="input.css">
</head>
<body>
<div class="container">

    <h2>Create Your Schedule</h2>
    
    <!-- Subjects -->
    <div class="row">
        <input id="subjects" placeholder="Subjects (comma)">
        <input id="weak" placeholder="Weak subject">
</div>

<!-- Current Day Input -->
<h3 id="dayTitle">Monday</h3>
<input id="hours" placeholder="Enter hours">

<!-- Buttons -->
<div class="btns">
    <button onclick="nextDay()">Next Day</button>
    <button onclick="generate()">Generate Schedule</button>
</div>
<div id="output"></div>

</div>

<script src="core.js"></script>
<script>
let days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
let index = 0;
let weeklyTime = {};



function nextDay(){
    if(index >= days.length){
        alert("All days already entered!");
        return;
    }

    let h = +document.getElementById("hours").value;

    if(isNaN(h) || h < 0){
        alert("Enter valid hours");
        return;
    }

    weeklyTime[days[index]] = h;
    index++;

    if(index < days.length){
        document.getElementById("dayTitle").innerText = days[index];
        document.getElementById("hours").value = "";
    } else {
        alert("✅ All days entered! Now click Generate.");
        document.getElementById("dayTitle").innerText = "All days entered";
    }

    console.log("WeeklyTime:", weeklyTime); // 👈 DEBUG
}


function generate(){
    if(Object.keys(weeklyTime).length < 7){
        alert("Please enter hours for all 7 days first!");
        return;
    }

    let subjectsInput = document.getElementById("subjects").value;
    if(!subjectsInput){
        alert("Enter at least one subject!");
        return;
    }

    let weakInput = document.getElementById("weak").value;
    let subjects = parseSubjects(subjectsInput);

    createSchedule(subjects, weakInput, weeklyTime);

    showSchedule(); // 👈 display here
}

function showSchedule(){
    let div = document.getElementById("output");
    div.innerHTML = "";

    for(let day in schedule){
        let readable = new Date(day).toDateString();

        let html = `<div class="day-card">`;
        html += `<h3>${readable}</h3>`;

        if(schedule[day].length > 0){
            schedule[day].forEach(t=>{
                html += `
                    <div class="task">
                        <span>${t.subject}</span>
                        <span class="duration">${t.duration} hr</span>
                    </div>
                `;
            });
        } else {
            html += `<p class="empty">No study planned</p>`;
        }

        html += `</div>`;

        div.innerHTML += html;
    }
}




</script>

</body>
</html>
