<!DOCTYPE html>
<html>
<head>
<title>Today</title>
<link rel="stylesheet" href="todo.css">
</head>

<body>

<h2>Today's Tasks</h2>

<div id="todo"></div>

<script src="core.js"></script>
<script>

let today = new Date().toISOString().split("T")[0];

let tasks = schedule[today] || [];

if(tasks.length === 0){
    todo.innerHTML = "No tasks today";
}else{
    tasks.forEach(t=>{
        todo.innerHTML += `
        <div>
            <input type="checkbox">
            ${t.subject} - ${t.duration} hr
        </div>
        `;
    });
}

</script>

</body>
</html>
