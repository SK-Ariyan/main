<!DOCTYPE html>
<html>
<head>
<title>Calendar</title>
<link rel="stylesheet" href="calender.css">
</head>

<body>

<div class="container">

    <h2>📆 Check by Date</h2>

    <input type="date" id="date">
    <button onclick="check()">Check</button>

    <div id="result"></div>

</div>

<script src="core.js"></script>

<script>
async function check(){

    let dateInput = document.getElementById("date");
    let resultDiv = document.getElementById("result");

    if(!dateInput.value) return;

    let tasks = await fetchTasksByDate(dateInput.value);

    resultDiv.innerHTML = "";

    if(tasks.length === 0){
        resultDiv.innerHTML = `<p class="empty">No tasks</p>`;
        return;
    }

    tasks.forEach(t=>{
        resultDiv.innerHTML += `
            <div class="task">
                <strong>${t.subject}</strong><br>
                ⏱ ${t.duration} hr
            </div>
        `;
    });
}


</script>

</body>

</html>
